name: Manga Auto Translate FA

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "لینک ورودی (صفحه مانگا / ZIP / PDF / تصویر)"
        required: true
        type: string
      gemini_api_key:
        description: "کلید Gemini ai:  key1,key2"
        required: true
        type: string
      ocr_lang:
        description: "زبان OCR (مثلاً en یا ko en یا ja en)"
        required: false
        default: "en"
        type: string
      model:
        description: "مدل Gemini"
        required: false
        default: "gemini-flash-latest"
        type: string
      reading_order:
        description: "ترتیب خواندن"
        required: false
        default: "rtl"
        type: choice
        options:
          - rtl
          - ltr
      output_format:
        description: "فرمت خروجی"
        required: false
        default: "pdf"
        type: choice
        options:
          - pdf
          - zip

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev
      - name: Install Python dependencies

        run: |
          python -m pip install --upgrade pip setuptools wheel
          cat > constraints.txt << EOF
          numpy==1.26.4
          opencv-python-headless==4.8.1.78
          opencv-python==4.8.1.78
          opencv-contrib-python==4.8.1.78
          EOF

          pip install --no-cache-dir --constraint constraints.txt numpy==1.26.4
          pip install --no-cache-dir --constraint constraints.txt opencv-python-headless==4.8.1.78
          pip install --no-cache-dir --no-deps --constraint constraints.txt paddlepaddle==2.6.2 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          pip install --no-cache-dir --no-deps --constraint constraints.txt paddleocr==2.7.0.3
          pip install --no-cache-dir --constraint constraints.txt pymupdf
          pip install --no-cache-dir --constraint constraints.txt attrdict cython fire lxml openpyxl pdf2docx premailer python-docx visualdl
          pip install --no-cache-dir --constraint constraints.txt Pillow pyclipper lmdb scikit-image shapely python-bidi arabic-reshaper rapidfuzz imageio matplotlib tqdm requests beautifulsoup4 google-genai decorator imgaug opt-einsum astor pyyaml imgaug
      - name: Download font
        run: |
          mkdir -p fonts
          echo "Downloading Vazirmatn Bold..."
          curl -L -o fonts/Vazirmatn-Bold.ttf \
            "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf"
          FONT_PATH="fonts/Vazirmatn-Bold.ttf"
          echo "FONT_PATH=$FONT_PATH" >> $GITHUB_ENV

      - name: Run translator
        env:
          GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        run: |
          OUTPUT="output_fa.${{ inputs.output_format }}"
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV

          python manga_translator.py \
            -i "${{ inputs.input_url }}" \
            -o "$OUTPUT" \
            --font "$FONT_PATH" \
            --ocr-lang ${{ inputs.ocr_lang }} \
            --model "${{ inputs.model }}" \
            --reading-order ${{ inputs.reading_order }} \
            --cpu \
            --api-key "$GEMINI_API_KEY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: translated-manga
          path: ${{ env.OUTPUT }}
          retention-days: 7
          if-no-files-found: warn
