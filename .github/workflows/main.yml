name: Manga Auto Translate FA

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "لینک ورودی (صفحه مانگا / ZIP / PDF / تصویر)"
        required: true
        type: string
      gemini_api_key:
        description: "کلید Gemini ai:  key1,key2"
        required: true
        type: string
      ocr_lang:
        description: "زبان OCR (مثلاً en یا ko en یا ja en)"
        required: false
        default: "en"
        type: string
      model:
        description: "مدل Gemini"
        required: false
        default: "gemini-flash-latest"
        type: string
      reading_order:
        description: "ترتیب خواندن"
        required: false
        default: "rtl"
        type: choice
        options:
          - rtl
          - ltr
      output_format:
        description: "فرمت خروجی"
        required: false
        default: "pdf"
        type: choice
        options:
          - pdf
          - zip

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libgomp1
      - name: Install Python dependencies

        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4
          pip install -r requirements.txt  --no-deps
      - name: Download font
        run: |
          mkdir -p fonts
          if [ -n "${{ inputs.font_url }}" ]; then
            echo "Downloading custom font..."
            curl -L -o fonts/custom.ttf "${{ inputs.font_url }}"
            FONT_PATH="fonts/custom.ttf"
          else
            echo "Downloading Vazirmatn Bold..."
            curl -L -o fonts/Vazirmatn-Bold.ttf \
              "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf"
            FONT_PATH="fonts/Vazirmatn-Bold.ttf"
          fi
          echo "FONT_PATH=$FONT_PATH" >> $GITHUB_ENV

      - name: Run translator
        env:
          GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        run: |
          OUTPUT="output_fa.${{ inputs.output_format }}"
          if [ "${{ inputs.output_format }}" = "folder" ]; then
            OUTPUT="output_pages"
          fi

          python manga_translator.py \
            -i "${{ inputs.input_url }}" \
            -o "$OUTPUT" \
            --font "$FONT_PATH" \
            --ocr-lang ${{ inputs.ocr_lang }} \
            --model "${{ inputs.model }}" \
            --reading-order ${{ inputs.reading_order }} \
            --cpu \
            --api-key "$GEMINI_API_KEY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: translated-manga
          path: |
            output_fa.*
            output_pages/
          retention-days: 7
          if-no-files-found: warn
